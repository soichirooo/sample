<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- v6「クワイエット・コンパス」
       おしゃれなロゴの原則(低情報量・余白・細線・2色)に沿って v5 を削ぎ落とした版。
       要素は「細いリング/北の珠/2本のしずく針/軸」の4つのみ -->
  <rect width="1024" height="1024" rx="229" fill="#F7F2E8"/>
  <!-- 文字盤:細いリング。余白を大きく取る -->
  <circle cx="512" cy="512" r="316" fill="none" stroke="#2B2933" stroke-width="13"/>
  <!-- 北の珠:リングの12時に重ねたラベンダーの点 -->
  <circle cx="512" cy="196" r="15" fill="#B3A1D6"/>
  <!-- 残像の針(ラベンダー) -->
  <g transform="rotate(-30 512 512)">
    <path d="M 512 512 C 489 440, 486 345, 500 276 A 12 12 0 0 1 524 276 C 538 345, 535 440, 512 512 Z"
          fill="#B3A1D6"/>
    <path d="M 512 512 C 489 584, 486 679, 500 748 A 12 12 0 0 0 524 748 C 538 679, 535 584, 512 512 Z"
          fill="#B3A1D6" opacity="0.45"/>
  </g>
  <!-- 現在の針(チャコール) -->
  <g transform="rotate(30 512 512)">
    <path d="M 512 512 C 489 440, 486 345, 500 276 A 12 12 0 0 1 524 276 C 538 345, 535 440, 512 512 Z"
          fill="#2B2933"/>
    <path d="M 512 512 C 489 584, 486 679, 500 748 A 12 12 0 0 0 524 748 C 538 679, 535 584, 512 512 Z"
          fill="#2B2933" opacity="0.5"/>
  </g>
  <!-- 軸 -->
  <circle cx="512" cy="512" r="10" fill="#F7F2E8" stroke="#2B2933" stroke-width="7"/>
</svg>
