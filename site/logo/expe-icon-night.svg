<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- v8「しずくの針」ナイト
       夜のグラデーションの中、細い針が光る珠へ向かう。儚さ最優先の塗り -->
  <defs>
    <radialGradient id="sky" cx="0.82" cy="0.18" r="1.15">
      <stop offset="0" stop-color="#4E4168"/>
      <stop offset="0.55" stop-color="#2E2940"/>
      <stop offset="1" stop-color="#201D28"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="229" fill="url(#sky)"/>
  <!-- 遠くの星 -->
  <circle cx="270" cy="280" r="5" fill="#F7F2E8" opacity="0.5"/>
  <circle cx="640" cy="800" r="4" fill="#F7F2E8" opacity="0.35"/>
  <!-- 針(細身) -->
  <g transform="rotate(45 512 512)">
    <path d="M 512 150 C 486 300, 466 480, 466 640 A 48 48 0 1 0 560 640 C 560 480, 538 300, 512 150 Z"
          fill="#F7F2E8" stroke="#F7F2E8" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <!-- 珠:光暈をまとう -->
  <circle cx="838" cy="186" r="72" fill="#C9B6EA" opacity="0.22"/>
  <circle cx="838" cy="186" r="26" fill="#E3D6F5"/>
</svg>
