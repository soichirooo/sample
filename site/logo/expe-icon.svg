<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- v7「じぶんの方角」
       コンセプト:北ではなく、あなたの「次」を指す針。
       ・針が北(頂点の小さな点)を無視して、リングの開口部にある珠を指す
       ・珠 = アプリが提案する「例えばこんな空間」(example×Space)
       ・開いたリング = 既知の円の外へ広がる空間(expand×Space)
       ・珠の先 = まだ知らない体験(experience×Space) -->
  <rect width="1024" height="1024" rx="229" fill="#F7F2E8"/>
  <!-- リング:珠の方向(北東上方)だけ開いている -->
  <path d="M 795 362 A 320 320 0 1 1 691 247"
        fill="none" stroke="#2B2933" stroke-width="16" stroke-linecap="round"/>
  <!-- 北:誰にとっても同じ「正解」の印。針はこれを指さない -->
  <circle cx="512" cy="192" r="8" fill="#2B2933" opacity="0.7"/>
  <!-- 珠:あなたの「次に行きたい」場所。開口部に浮かぶ -->
  <circle cx="750" cy="298" r="26" fill="#B3A1D6"/>
  <!-- 針:しずく型。珠をまっすぐ指す。尾はラベンダー -->
  <g transform="rotate(48 512 512)">
    <path d="M 512 512 C 489 440, 486 345, 500 276 A 12 12 0 0 1 524 276 C 538 345, 535 440, 512 512 Z"
          fill="#2B2933"/>
    <path d="M 512 512 C 500 552, 498 592, 505 620 A 9 9 0 0 0 519 620 C 526 592, 524 552, 512 512 Z"
          fill="#B3A1D6"/>
  </g>
  <!-- 軸 -->
  <circle cx="512" cy="512" r="10" fill="#F7F2E8" stroke="#2B2933" stroke-width="7"/>
</svg>
