<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- v8「しずくの針」ライト
       コンセプト:あなたの「次」を指す針。
       要素は対角に大きく流れるしずく型の針と、その先の珠の2つだけ。
       文字盤・リング・軸は全て廃止 -->
  <rect width="1024" height="1024" rx="229" fill="#F7F2E8"/>
  <g transform="rotate(45 512 512)">
    <path d="M 512 150 C 478 300, 452 480, 452 644 A 62 62 0 1 0 572 644 C 572 480, 546 300, 512 150 Z"
          fill="#2B2933" stroke="#2B2933" stroke-width="18" stroke-linejoin="round"/>
  </g>
  <!-- 珠:あなたの「次」 -->
  <circle cx="838" cy="186" r="30" fill="#B3A1D6"/>
</svg>
